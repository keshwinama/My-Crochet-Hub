
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch & Bloom 5.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark">✿</span>
            <div>
                <strong>stitch & bloom</strong>
                <small>your crochet studio</small>
            </div>
        </div>

        <div class="nav-label">WORKSPACE</div>

        <nav id="navigation">
            <button class="nav-item active" data-page="home">⌂ <span>Home</span></button>
            <button class="nav-item" data-page="projects">▦ <span>My projects</span></button>
            <button class="nav-item" data-page="counter">＋ <span>Row counter</span></button>
            <button class="nav-item" data-page="timer">◷ <span>Crochet timer</span></button>
            <button class="nav-item" data-page="stash">▤ <span>Yarn stash</span></button>
            <button class="nav-item" data-page="patterns">▧ <span>Pattern library</span></button>
            <button class="nav-item" data-page="stitches">✣ <span>Stitch dictionary</span></button>
            <button class="nav-item" data-page="grid">▦ <span>Fillet designer</span></button>
            <button class="nav-item" data-page="calendar">▦ <span>Calendar</span></button>
            <button class="nav-item" data-page="calculators">⌗ <span>Calculators</span></button>
            <button class="nav-item" data-page="sketchbook">✎ <span>Sketchbook</span></button>
            <button class="nav-item" data-page="stats">♡ <span>Statistics</span></button>
        </nav>

        <div class="sidebar-bottom">
            <div class="mini-flower">✿</div>
            <p>Make something lovely.</p>
            <small>Your creative corner</small>
        </div>
    </aside>

    <main class="main-area">

        <header class="topbar">
            <div>
                <span class="eyebrow" id="eyebrow">YOUR CREATIVE SPACE</span>
                <h1 id="page-title">Good day, maker ✿</h1>
            </div>

            <div class="top-actions">
                <span class="today" id="today-label"></span>
                <button class="icon-button" id="quick-add">＋</button>
            </div>
        </header>

        <section id="page-content" class="page-content"></section>

        <footer>
            Stitch & Bloom 5.0 ✿ Made for your creative journey
        </footer>

    </main>
</div>

<dialog id="editor-dialog">
    <form method="dialog" id="editor-form">

        <div class="dialog-head">
            <div>
                <span class="eyebrow">YOUR STUDIO</span>
                <h2 id="dialog-title">Add something</h2>
            </div>

            <button class="icon-button" value="cancel">×</button>
        </div>

        <div id="dialog-fields" class="form-grid"></div>

        <div class="dialog-actions">
            <button class="btn secondary" value="cancel">Cancel</button>
            <button class="btn primary" id="save-entry" value="default">Save</button>
        </div>

    </form>
</dialog>

<script src="app.js"></script>

</body>
</html>
